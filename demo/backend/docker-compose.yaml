
services:
  app1:
    build:
      context: ./app1
      dockerfile: Dockerfile
    environment:
      - STORAGE_URL=http://app2
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app

  app2:
    build:
      context: ./app2
      dockerfile: Dockerfile
    volumes:
      - ./app2/flag.txt:/flag.txt:ro
      - storage-data:/var/www/html/storage

volumes:
  db-data:
  storage-data: